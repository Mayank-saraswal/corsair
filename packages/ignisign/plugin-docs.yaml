displayName: Ignisign
description: Electronic signature and document workflow integration for Ignisign eIDAS-compliant digital signatures.
overviewNote: >-
  Ignisign operations require an API key configured as a Bearer token.
  Run the Corsair database migration once before passing the connection to
  `createCorsair`; creating a SQLite file does not create Corsair's tables.
  Before creating a tenant connect link, mount a Hub delivery handler as
  described in [Connect / OAuth](/management/connect). A call for a tenant with
  no stored key fails with `AuthMissingError`, which carries a connect link when
  Hub is configured.
examples:
  read:
    path: applications.getContext
    title: Read application context
    args:
      appId: appId_sample
  write:
    path: signatureRequests.createInOneCall
    title: Create signature request in one call
    args:
      title: Employment Agreement
      signatureMethod: SIMPLE_STD
      signers:
        - email: signer@example.com
      documents:
        - originalName: contract.pdf
          mimeType: application/pdf
          base64: JVBERi0xLjQK...
