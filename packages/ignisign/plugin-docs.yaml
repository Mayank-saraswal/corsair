    Returns a binary response `{ kind: 'binary', contentType, base64, size }`.
  proofs.downloadSignatureByType: >-
    Returns a binary response `{ kind: 'binary', contentType, base64, size }`.
  proofs.downloadLowLevelSignatureProof: >-
    Returns a binary response `{ kind: 'binary', contentType, base64, size }`.
