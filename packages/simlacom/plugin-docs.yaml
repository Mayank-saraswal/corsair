displayName: "Simla.com"
description: Access and manage customers, orders, catalogs, loyalty, deliveries, tickets, telephony and other resources through the current Simla.com REST API v5.
domain: simla.com
recommendedAuth: api_key
factory:
  note: Configure the instance subdomain used by the Simla.com API host.
  options:
    subdomain: demo
overviewNote: |
  Configure an API key in Corsair and set `subdomain` to the account-specific host prefix. Requests use `X-API-KEY` and `https://{subdomain}.simla.com/api/v5/`. POST nested values are JSON strings inside form-urlencoded bodies.

  List operations pass through the documented `page`/`limit` pagination metadata; cursor-based operations accept their documented cursor parameter. The account is limited to 10 requests per second per IP (40 for telephony); the provider may respond with 503 when the limit is exceeded.

  Binary upload expects base64 in `body`; binary download responses are `{ kind: 'binary', contentType, base64 }` and the client enforces a 20 MiB safety limit.

  The plugin excludes the 27 provider-hosted integration-module callback/configuration routes and all inbound webhook receiving/management (outside issue #2408).
examples:
  read:
    path: api.apiVersions.get
    title: Read the available Simla.com API versions
  write:
    path: customers.create.post
    title: Create a customer record
apiNotes:
  files.upload.post: Pass a base64-encoded string in `body`; the provider documents this request as `application/octet-stream`.
  files.byIdDownload.get: Returns the file bytes in a base64 envelope; maximum response size is capped by the client at 20 MiB.
  telephony.getCallsByIdRecord.get: Returns call-recording bytes in a base64 envelope; maximum response size is capped by the client at 20 MiB.
  orders.byExternalidPlatesByPlateidPrint.get: The OpenAPI reference documents success/error statuses but no response content schema. The operation validates a JSON object; its exact fields are unverified.
  dataBook.referenceCouriersCreate.post: The official OpenAPI marks `courier.firstName` required but omits its type and constraints; the plugin enforces its presence, while the value shape is unverified.
  dataBook.referenceCouriersByIdEdit.post: The official OpenAPI marks `courier.firstName` required but omits its type and constraints; the plugin enforces its presence, while the value shape is unverified.
  telephony.callEvent.post: The official OpenAPI marks `phone`, `type`, and `code` required but omits their types; the plugin enforces their presence, while their value shapes are unverified.
