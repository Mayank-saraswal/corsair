displayName: Interzoid
description: Data matching, entity resolution, data quality, validation, enrichment, and normalization cloud APIs.
domain: interzoid.com
recommendedAuth: api_key
examples:
  read:
    path: matching.getCompanyMatchAdvanced
    title: Generate company match similarity key
    args:
      company: IBM Corporation
      algorithm: model-v4-wide
overviewNote: |
  Interzoid provides AI and algorithmic data matching keys (SimKeys), standardization, enrichment, and validation APIs.
  An Interzoid API key (license) is required for authenticated operations.
  Each API call consumes credits based on account balance.
