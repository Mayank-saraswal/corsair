displayName: "Trustpilot"
description: Read Trustpilot business, service review, product review, invitation, consumer profile and Data Solutions API data.
recommendedAuth: api_key
overviewNote: >-
  Public API operations need a Trustpilot API key. Private business and invitation operations need an OAuth 2.0 access token; select oauth_2 for these calls and provide apiKey in plugin options when public calls must be made from that same configuration. Trustpilot documents authorization-code and client-credentials grants, but does not publish per-operation scopes in these references.
apiNotes:
  businessUnits.privateReviews: >-
    Private reviews can include consumer email addresses, reference IDs, and Find Reviewer responses. Treat returned personal data as sensitive; the plugin omits it from logs and sanitized HTTP errors.
  productReviews.privateList: >-
    Private product reviews include consumer email and reference ID fields. Treat returned personal data as sensitive; the plugin omits it from logs and sanitized HTTP errors.
  invitations.link: >-
    Invitation links require consumer email/name fields. The plugin does not log the request or echo those values in errors.
