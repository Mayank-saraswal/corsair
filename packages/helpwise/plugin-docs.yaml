displayName: Helpwise
description: Shared team inboxes, conversations, messages, contacts, tags, and analytics for Helpwise.
overviewNote: >-
  Helpwise authentication requires both an API Key and API Secret from Helpwise
  Settings > API (HTTP Basic auth header formatted as `API_KEY:API_SECRET`).
  Run the Corsair database migration once before passing the connection to
  `createCorsair`; creating a SQLite file does not create Corsair's tables.
  Before creating a tenant connect link, mount a Hub delivery handler as described
  in [Connect / OAuth](/management/connect). A call for a tenant with no stored
  key fails with `AuthMissingError`, which carries a connect link when Hub is
  configured.
factory:
  note: >-
    A call with no stored key fails with `AuthMissingError` and a connect link
    when Hub is configured. To skip that, connect the tenant through Hub below
    or store the credentials with `tenant.helpwise.keys.set_api_key(...)` and
    `tenant.helpwise.keys.set_api_secret(...)` first.
examples:
  read:
    path: conversations.list
    title: List conversations
    args:
      limit: 10
  write:
    path: messages.sendEmail
    title: Send an email
    args:
      mailbox_id: 101
      to: customer@example.com
      subject: Support inquiry response
      body: <p>Thank you for reaching out to us.</p>
