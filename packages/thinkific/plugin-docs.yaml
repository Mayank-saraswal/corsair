  users.createExpressSignInLink:
    call: '{ path: {"id":1} }'
apiNotes:
  bundles.createEnrollment: Thinkific documents both 201 synchronous and 202
    asynchronous creation responses without a response body schema; this
    operation validates an empty response rather than inventing a job payload.
  users.createExpressSignInLink: The returned Express Sign In URL is
    password-equivalent and must be treated as a secret. Do not copy it into
    logs or share it outside the intended learner.
  productPublishRequests.list: The published OpenAPI response component points its
    items to PromotionResponse, but the operation returns Product Publish
    Requests. This plugin validates items with ProductPublishRequest, matching
    the documented detail route.
