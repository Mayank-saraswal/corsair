displayName: Thinkific
description: Manage Thinkific users, enrollments, courses, products, groups,
  orders, promotions, and related Admin API v1 resources.
recommendedAuth: api_key
overviewNote: This plugin uses the documented Admin API v1 at
  https://api.thinkific.com/api/public/v1. Configure an API key and store the
  Thinkific site subdomain as the account tenant_external_id. It sends
  X-Auth-API-Key and X-Auth-Subdomain headers. Admin API v2 is not verified.
  Webhook management/receivers and OAuth-only Site Scripts operations are
  excluded.
references:
  - title: Thinkific Admin API reference
    url: https://developers.thinkific.com/api/api-documentation
  - title: Official Admin API v1 OpenAPI export
    url: https://developers.thinkific.com/openapi/thinkific-admin-api-v1.yaml
  - title: API key authorization
    url: https://support.thinkific.dev/hc/en-us/articles/4422657425431
  - title: REST response format and pagination
    url: https://support.thinkific.dev/hc/en-us/articles/4422657182743
  - title: REST rate limits
    url: https://support.thinkific.dev/hc/en-us/articles/4422684774935
examples:
  read:
    path: courses.list
    title: List Thinkific courses
    args:
      query:
        page: 1
        limit: 25
  write:
    path: users.create
    title: Create a Thinkific user
    args:
      body:
        first_name: Sample
        last_name: Learner
        email: learner@example.com
